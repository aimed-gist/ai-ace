name: Sync News from Spreadsheet

on:
  schedule:
    # 매일 KST 00:45 = UTC 15:45
    # (members 00:00, publications 00:15, partners 00:30, news 00:45)
    - cron: "45 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync news from spreadsheet
        run: node scripts/sync-news.mjs

      - name: Check for changes
        id: changes
        run: |
          mkdir -p public/images/colab public/images/notice public/images/media
          git add src/data/news.json \
                  public/images/colab/ \
                  public/images/notice/ \
                  public/images/media/
          git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-sync news + images from spreadsheet [bot]"
          git push

      - name: Trigger site deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN 푸시는 on:push 워크플로를 트리거하지 않으므로
          # deploy 워크플로를 명시적으로 실행한다.
          gh workflow run deploy.yml --ref main
