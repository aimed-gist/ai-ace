name: Sync News from Spreadsheet

on:
  schedule:
    # 매일 KST 00:45 = UTC 15:45
    # (members 00:00, publications 00:15, partners 00:30, news 00:45)
    - cron: "45 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync news from spreadsheet
        run: node scripts/sync-news.mjs

      - name: Check for changes
        id: changes
        run: |
          mkdir -p public/images/colab
          git add src/data/news.json public/images/colab/
          git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-sync news + co-lab images from spreadsheet [bot]"
          git push
