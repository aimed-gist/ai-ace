name: Sync Publications from Spreadsheet

on:
  schedule:
    # 매일 KST 00:15 = UTC 15:15
    # (멤버 sync는 00:00, Publications는 15분 뒤로 살짝 분리)
    - cron: "15 15 * * *"
  workflow_dispatch: # 수동 실행 지원

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync publications from spreadsheet
        run: node scripts/sync-publications.mjs

      - name: Check for changes
        id: changes
        run: |
          git add src/data/papers.json
          git diff --cached --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-sync publications from spreadsheet [bot]"
          git push
